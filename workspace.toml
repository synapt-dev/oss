# The four public repositories that make up synapt's open-source stack.
# Read by `gr2 workspace init-from-topology`; each entry is one repository.

workspace_name = "oss"

[[repos]]
key = "grip"
path = "grip"
url = "https://github.com/synapt-dev/grip.git"

[[repos]]
key = "recall"
path = "recall"
url = "https://github.com/synapt-dev/recall.git"

[[repos]]
key = "runner"
path = "runner"
url = "https://github.com/synapt-dev/runner.git"

[[repos]]
key = "eval"
path = "eval"
url = "https://github.com/synapt-dev/eval.git"
